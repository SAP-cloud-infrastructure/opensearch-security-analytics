name: Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build and release from'
        required: true
        type: string
      version:
        description: 'OpenSearch version (e.g. 3.7)'
        required: true
        type: string
      common_utils_version_qualifier:
        description: 'common-utils version qualifier (e.g. sci-v3), or "official" to use the official OpenSearch common-utils from Maven'
        required: true
        type: string
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Resolve parameters
        id: params
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            # Release published event: tag is provided directly by the event.
            # Expected tag format: {major}.{minor}.0.0-sci-v{N}
            TAG="${{ github.event.release.tag_name }}"
            # Skip if the release already has assets attached (avoid double-build)
            ASSET_COUNT=$(gh release view "${TAG}" \
              --repo "${{ github.repository }}" \
              --json assets --jq '.assets | length')
            if [ "${ASSET_COUNT}" -gt 0 ]; then
              echo "Release ${TAG} already has ${ASSET_COUNT} asset(s) attached — skipping build." >&2
              exit 0
            fi
            # Strip the -sci-v{N} suffix to get the base version
            BASE="${TAG%-sci-v*}"
            # Extract major.minor from {major}.{minor}.0.0
            VERSION=$(echo "$BASE" | cut -d. -f1,2)
            # Use the release target commitish as the branch
            BRANCH="${{ github.event.release.target_commitish }}"
            # Resolve the latest sci-vN qualifier from the common-utils releases that
            # match the same OpenSearch base version (e.g. 3.7.0.0-sci-v*)
            CU_BASE="${BASE}"
            CU_EXISTING=$(gh release list --limit 100 \
              --repo "SAP-cloud-infrastructure/opensearch-common-utils" \
              --json tagName --jq '.[].tagName' \
              | grep -E "^${CU_BASE}-sci-v[0-9]+$" || true)
            if [ -z "$CU_EXISTING" ]; then
              # No matching common-utils release found; fall back to the official release
              CU_QUALIFIER="official"
            else
              CU_MAX_N=$(echo "$CU_EXISTING" | sed "s/^${CU_BASE}-sci-v//" | sort -n | tail -1)
              CU_QUALIFIER="sci-v${CU_MAX_N}"
            fi
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "qualifier=${TAG##*-}" >> "$GITHUB_OUTPUT"
            echo "opensearch_version=${VERSION}.0" >> "$GITHUB_OUTPUT"
            echo "common_utils_qualifier=${CU_QUALIFIER}" >> "$GITHUB_OUTPUT"
            echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
            echo "create_release=false" >> "$GITHUB_OUTPUT"
          else
            # Manual dispatch: compute next sci-vN tag as before
            VERSION="${{ inputs.version }}"
            BASE_TAG="${VERSION}.0.0"
            EXISTING=$(gh release list --limit 100 --repo "${{ github.repository }}" \
              --json tagName --jq '.[].tagName' \
              | grep -E "^${BASE_TAG}-sci-v[0-9]+$" || true)
            if [ -z "$EXISTING" ]; then
              NEXT_N=1
            else
              MAX_N=$(echo "$EXISTING" | sed "s/^${BASE_TAG}-sci-v//" | sort -n | tail -1)
              NEXT_N=$((MAX_N + 1))
            fi
            QUALIFIER="sci-v${NEXT_N}"
            TAG="${BASE_TAG}-${QUALIFIER}"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "qualifier=${QUALIFIER}" >> "$GITHUB_OUTPUT"
            echo "opensearch_version=${VERSION}.0" >> "$GITHUB_OUTPUT"
            echo "common_utils_qualifier=${{ inputs.common_utils_version_qualifier }}" >> "$GITHUB_OUTPUT"
            echo "branch=${{ inputs.branch }}" >> "$GITHUB_OUTPUT"
            echo "create_release=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.params.outputs.branch }}
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Publish common-utils to local Maven repository
        if: steps.params.outputs.common_utils_qualifier != 'official'
        run: |
          CU_TAG="${{ steps.params.outputs.opensearch_version }}.0-${{ steps.params.outputs.common_utils_qualifier }}"
          git clone --depth 1 --branch "${CU_TAG}" \
            https://github.com/SAP-cloud-infrastructure/opensearch-common-utils.git /tmp/common-utils
          cd /tmp/common-utils
          ./gradlew publishToMavenLocal \
            -Dbuild.snapshot=false \
            -Dbuild.version_qualifier="${{ steps.params.outputs.common_utils_qualifier }}"

      - name: Build plugin zip (official common-utils)
        if: steps.params.outputs.common_utils_qualifier == 'official'
        run: |
          ./gradlew bundlePlugin \
            -Dbuild.version_qualifier="${{ steps.params.outputs.qualifier }}" \

      - name: Build plugin zip (custom common-utils)
        if: steps.params.outputs.common_utils_qualifier != 'official'
        run: |
          ./gradlew bundlePlugin \
            -Dbuild.version_qualifier="${{ steps.params.outputs.qualifier }}" \
            -Dcommon_utils.version="${{ steps.params.outputs.opensearch_version }}.0-${{ steps.params.outputs.common_utils_qualifier }}"

      - name: Locate artifact
        id: artifact
        run: |
          ZIP=$(ls build/distributions/*.zip | head -1)
          echo "path=${ZIP}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename ${ZIP})" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release and upload artifact
        if: steps.params.outputs.create_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.params.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --target "${{ steps.params.outputs.branch }}" \
            --title "${{ steps.params.outputs.tag }}" \
            --notes "Release ${{ steps.params.outputs.tag }} built from branch \`${{ steps.params.outputs.branch }}\`." \
            "${{ steps.artifact.outputs.path }}#${{ steps.artifact.outputs.name }}"

      - name: Upload artifact to existing release
        if: steps.params.outputs.create_release == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.params.outputs.tag }}" \
            "${{ steps.artifact.outputs.path }}#${{ steps.artifact.outputs.name }}" \
            --repo "${{ github.repository }}" \
            --clobber
